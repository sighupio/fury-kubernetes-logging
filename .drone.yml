name: license
kind: pipeline
type: docker
node:
   performance: low
clone:
  depth: 1
volumes:
  - name: mise-cache
    host:
      path: /root/mise_data_dir
steps:
  - name: check
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      MISE_DATA_DIR: /mise-data
      GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - mise run check-license

---
name: validate
kind: pipeline
type: docker
node:
   performance: low
depends_on:
  - license
clone:
  depth: 1
platform:
  os: linux
  arch: amd64
volumes:
  - name: mise-cache
    host:
      path: /root/mise_data_dir
steps:
  - name: render
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      MISE_DATA_DIR: /mise-data
      GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    depends_on:
      - clone
    commands:
      - eval "$(mise activate bash --shims)"
      - kustomize build katalog/opensearch-single > opensearch-single.yml
      - kustomize build katalog/opensearch-triple > opensearch-triple.yml
      - kustomize build katalog/opensearch-dashboards > opensearch-dashboard.yml
      - kustomize build katalog/logging-operator > logging-operator.yml
      - kustomize build katalog/logging-operated > logging-operated.yml
      - kustomize build katalog/configs > configs.yml
      - kustomize build katalog/loki-configs > loki-configs.yml
      - kustomize build katalog/loki-distributed > loki-distributed.yml
      - kustomize build katalog/minio-ha > minio-ha.yml

  - name: lint
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      MISE_DATA_DIR: /mise-data
      GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    depends_on:
      - render
    commands:
      - mise run lint

  - &check-deprecated-apis
    name: check-deprecated-apis
    image: us-docker.pkg.dev/fairwinds-ops/oss/pluto:v5
    pull: always
    depends_on:
      - lint
    commands:
      # we use --ignore-deprecations because we don't want the CI to fail when the API has not been removed yet.
      - /pluto detect $${KUBERNETES_MANIFESTS} --ignore-deprecations --target-versions=k8s=v1.36.0
    environment:
      KUBERNETES_MANIFESTS: opensearch-triple.yml

  - <<: *check-deprecated-apis
    name: check-deprecated-apis-opensearch-single
    environment:
      KUBERNETES_MANIFESTS: opensearch-single.yml

  - <<: *check-deprecated-apis
    name: check-deprecated-apis-logging-operator
    environment:
      KUBERNETES_MANIFESTS: logging-operator.yml

  - <<: *check-deprecated-apis
    name: check-deprecated-apis-logging-operated
    environment:
      KUBERNETES_MANIFESTS: logging-operated.yml

  - <<: *check-deprecated-apis
    name: check-deprecated-apis-configs
    environment:
      KUBERNETES_MANIFESTS: configs.yml

  - <<: *check-deprecated-apis
    name: check-deprecated-apis-opensearch-dashboard
    environment:
      KUBERNETES_MANIFESTS: opensearch-dashboard.yml

  - <<: *check-deprecated-apis
    name: check-deprecated-apis-loki-configs
    environment:
      KUBERNETES_MANIFESTS: loki-configs.yml

  - <<: *check-deprecated-apis
    name: check-deprecated-apis-loki-distributed
    environment:
      KUBERNETES_MANIFESTS: loki-distributed.yml

  - <<: *check-deprecated-apis
    name: check-deprecated-apis-minio-ha
    environment:
      KUBERNETES_MANIFESTS: minio-ha.yml

---
name: E2E Tests on kind clusters version 1.33.0
kind: pipeline
type: docker
platform:
  os: linux
  arch: amd64
depends_on:
  - validate
clone:
  depth: 1
trigger:
  ref:
    include:
      - refs/tags/**
volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: mise-cache
    host:
      path: /root/mise_data_dir
steps:
  - name: Create Kind Cluster
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      MISE_DATA_DIR: /mise-data
      KIND_VERSION: "0.29.0"
      KUBECTL_VERSION: "1.33.4"
      KIND_CONFIG: ./katalog/tests/kind/config.yml
      CLUSTER_VERSION: v1.33.0
      KUBECONFIG: kubeconfig-133
      CLUSTER_NAME: ${DRONE_REPO_NAME}-${DRONE_BUILD_NUMBER}-133
      GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: mise-cache
        path: /mise-data
    commands:
      - |
        mise use kind@$${KIND_VERSION} kubectl@$${KUBECTL_VERSION}
        eval "$(mise activate bash --shims)"
      - kind create cluster --name $${CLUSTER_NAME} --image registry.sighup.io/fury/kindest/node:$${CLUSTER_VERSION} --config $${KIND_CONFIG}
      - kind get kubeconfig --name $${CLUSTER_NAME} > $${KUBECONFIG}
    depends_on:
      - clone

  - name: End-to-End Tests
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    network_mode: host
    environment:
      MISE_DATA_DIR: /mise-data
      KUBECTL_VERSION: "1.33.4"
      KUBECONFIG: kubeconfig-133
      GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: mise-cache
        path: /mise-data
    commands:
      - |
        mise use bats@1.11.0 kubectl@$${KUBECTL_VERSION} kustomize@5.6.0
        eval "$(mise activate bash --shims)"
      - until kubectl get serviceaccount default > /dev/null 2>&1; do echo "waiting for control-plane" && sleep 1; done
      - bats -t ./katalog/tests/tests.sh
    depends_on:
      - Create Kind Cluster

  - name: Destroy Kind Cluster
    image: quay.io/sighup/mise:v2026.8.6
    pull: always
    environment:
      MISE_DATA_DIR: /mise-data
      KIND_VERSION: "0.29.0"
      KUBECTL_VERSION: "1.33.4"
      CLUSTER_NAME: ${DRONE_REPO_NAME}-${DRONE_BUILD_NUMBER}-133
      GITHUB_TOKEN:
        from_secret: github_token
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: mise-cache
        path: /mise-data
    commands:
      - |
        mise use kind@$${KIND_VERSION} kubectl@$${KUBECTL_VERSION}
        eval "$(mise activate bash --shims)"
      - "kind delete cluster --name $${CLUSTER_NAME} || true"
    depends_on:
      - End-to-End Tests
    when:
      status:
        - success
        - failure

