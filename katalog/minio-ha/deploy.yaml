# Source: minio/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio-logging
  labels:
    app: minio
    chart: minio-5.4.0
    release: minio-logging
    heritage: Helm
spec:
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: "Parallel"
  serviceName: minio-logging-svc
  replicas: 3
  selector:
    matchLabels:
      app: minio
      release: minio-logging
  template:
    metadata:
      name: minio-logging
      labels:
        app: minio
        release: minio-logging
      annotations:
        checksum/secrets: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
        checksum/config: 23f56eac9814f0fef566bd80bff0495dc90ffd414b289b3ede9543e01332276e
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
      serviceAccountName: minio-sa
      containers:
        - name: minio
          image: registry.sighup.io/fury/minio:RELEASE.2026-07-17T12-07-51Z-chainguard
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ce", "/usr/bin/docker-entrypoint.sh minio server http://minio-logging-{0...2}.minio-logging-svc.logging.svc/export-{0...1} -S /etc/minio/certs/ --address :9000 --console-address :9001"]
          volumeMounts:
            - name: export-0
              mountPath: /export-0
            - name: export-1
              mountPath: /export-1
          ports:
            - name: http
              containerPort: 9000
            - name: http-console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-logging
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-logging
                  key: rootPassword
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: "public"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: release
                      operator: In
                      values:
                        - minio-logging
                topologyKey: kubernetes.io/hostname
              weight: 100
      volumes:
        - name: minio-user
          secret:
            secretName: minio-logging
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: export-0
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: export-1
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
